services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: modelops
      POSTGRES_USER: modelops
      POSTGRES_PASSWORD: modelops
    ports:
      - "5432:5432"
    volumes:
      - modelops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelops -d modelops"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=modelops;Username=modelops;Password=modelops
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  modelops-postgres:
